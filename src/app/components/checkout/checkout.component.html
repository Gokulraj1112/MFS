<div class="container mt-4">
  <div class="row">
    <div class="col-lg-8">

      <div class="card">
        <div class="card-header">
          <h5>Delivery Information</h5>
        </div>
        <div class="card-body">

          <input class="form-control mb-2" placeholder="Full Name" [(ngModel)]="form.name">
          <input class="form-control mb-2" placeholder="Phone Number" [(ngModel)]="form.phone">

          <textarea class="form-control mb-2" placeholder="Delivery Address" [(ngModel)]="form.address"></textarea>

          <div class="row mb-2">
            <div class="col">
              <input class="form-control" placeholder="City" [(ngModel)]="form.city">
            </div>
            <div class="col">
              <input class="form-control" placeholder="Pincode" [(ngModel)]="form.pincode">
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label fw-bold">Delivery Date</label>
            <input type="date" class="form-control" [(ngModel)]="form.deliveryDate" [min]="minDate">
          </div>

          <textarea class="form-control mb-2" placeholder="Order Notes" [(ngModel)]="form.notes"></textarea>

          <!-- PAYMENT METHOD -->
          <div class="mt-3">
            <label class="form-label fw-bold">Payment Method</label>

            <div class="form-check">
              <input class="form-check-input" type="radio" name="paymentMethod" value="COD" [(ngModel)]="form.paymentMethod">
              <label class="form-check-label">Cash on Delivery</label>
            </div>

            <div class="form-check">
              <input class="form-check-input" type="radio" name="paymentMethod" value="ONLINE" [(ngModel)]="form.paymentMethod">
              <label class="form-check-label">Online Payment (UPI)</label>
            </div>
          </div>

          <!-- ONLINE PAYMENT UI -->
          <div *ngIf="form.paymentMethod === 'ONLINE'" class="border rounded p-3 mt-3">
            <h6>Scan QR to Pay</h6>
            <img src="assets/qr-code.png" width="200" class="mb-2">

            <p class="text-muted">Upload payment screenshot</p>

            <input type="file" class="form-control mb-2" (change)="onFileSelected($event)">

            <button 
              class="btn btn-success"
              (click)="uploadProofAndPlaceOrder()"
              [disabled]="!selectedFile">
              Pay & Place Order
            </button>

            <div class="text-success mt-2" *ngIf="paymentUploaded">
              ✅ Payment uploaded successfully!
            </div>
          </div>

        </div>
      </div>

    </div>

    <!-- ORDER SUMMARY -->
    <div class="col-lg-4">
      <div class="card">
        <div class="card-header">
          <h5>Order Summary</h5>
        </div>
        <div class="card-body">

          <div class="d-flex justify-content-between">
            <span>Total</span>
            <strong>₹{{ cartService.totalPrice().toFixed(2) }}</strong>
          </div>

          <!-- COD BUTTON -->
          <button 
            class="btn btn-primary btn-lg mt-3 w-100"
            *ngIf="form.paymentMethod === 'COD'"
            (click)="placeOrder()">
            Place Order (COD)
          </button>

        </div>
      </div>
    </div>

  </div>
</div>
